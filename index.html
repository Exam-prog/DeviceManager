<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 1. 필수 라이브러리 로드 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 2. 폰트 설정 (Noto Sans KR) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .slide-enter { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .leading-relaxed-custom { line-height: 1.6; }
        
        /* 토글 스위치 애니메이션 */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #0D4C8F;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #0D4C8F;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        /* 대시보드 그리드 효과 */
        .dashboard-grid {
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-slate-200 flex flex-col items-center justify-center min-h-screen p-4 transition-colors duration-500 gap-6" id="main-body">
    <div id="root" class="w-full flex flex-col items-center justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 아이콘 컴포넌트 ---

        const Lock = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>);

        const LayoutDashboard = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>);
        const Brain = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>);
        const Factory = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/></svg>);
        const BatteryCharging = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><path d="M6 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"/><path d="m11 7-3 5h4l-3 5"/><line x1="22" x2="22" y1="11" y2="13"/></svg>);
        const Flame = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>);
        const Droplet = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>);
        const Leaf = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.77 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>);
        const Layers = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>);
        const AlertTriangle = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>);
        const Download = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>);
        const ArrowRightCircle = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="m12 16 4-4-4-4"/></svg>);
        const FileText = ({ size = 24, className = "", style={} }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>);

        const App = () => {
            const [activeSlide, setActiveSlide] = useState(0);
            const [project, setProject] = useState('yuhan'); // 'yuhan' or 'amkor'

            // 테마 설정
            const theme = project === 'yuhan' ? {
                primary: '#AF251B',     // 유한 레드
                secondary: '#001738',   // 제논 네이비
                bg: '#f1f5f9',          // Slate-100
                logo: 'YH'
            } : {
                primary: '#0D4C8F',     // 앰코 블루
                secondary: '#454D59',   // 앰코 다크그레이
                bg: '#f8fafc',          // Slate-50
                logo: 'AMKOR'
            };

            // 프로젝트 전환 핸들러
            const toggleProject = () => {
                setProject(prev => prev === 'yuhan' ? 'amkor' : 'yuhan');
                setActiveSlide(0); // 슬라이드 초기화
            };

            // 배경색 동적 변경
            useEffect(() => {
                document.getElementById('main-body').className = 
                    `flex flex-col items-center justify-center min-h-screen p-4 transition-colors duration-500 gap-6 ${project === 'yuhan' ? 'bg-slate-200' : 'bg-gray-200'}`;
            }, [project]);

            // 공통 슬라이드 레이아웃
            const SlideLayout = ({ title, children, isDark = false }) => (
                <div className={`h-full w-full flex flex-col p-6 md:p-8 relative slide-enter ${isDark ? 'bg-slate-900 text-white' : 'bg-white'}`}>
                    <div className={`flex-none mb-3 z-10 border-b pb-2 ${isDark ? 'border-gray-700' : 'border-gray-100'}`}>
                        <h2 className="text-xl md:text-2xl font-black flex items-center gap-3" style={{color: isDark ? '#fff' : theme.secondary}}>
                            <span className="w-1.5 h-6" style={{backgroundColor: theme.primary}}></span>
                            {title}
                        </h2>
                    </div>
                    <div className="flex-1 min-h-0 relative flex flex-col justify-center">
                        {children}
                    </div>
                </div>
            );

            // 유한화학 슬라이드 (유지)
            const yuhanSlides = [
                // ... (기존 유한화학 슬라이드와 동일)
                {
                    id: 'title',
                    render: () => (
                        <div className="flex flex-col items-center justify-center h-full text-white p-4 text-center slide-enter relative overflow-hidden" style={{backgroundColor: theme.secondary}}>
                            <div className="absolute top-0 right-0 w-64 h-64 opacity-10 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2" style={{backgroundColor: theme.primary}}></div>
                            <div className="mb-6 w-16 h-1" style={{backgroundColor: theme.primary}}></div>
                            <h1 className="text-3xl md:text-5xl font-bold mb-4 tracking-tight leading-tight drop-shadow-lg">유한화학 데이터 무결성(DI)<br/>시스템 고도화 프로젝트</h1>
                            <h2 className="text-base md:text-xl font-light opacity-90 mt-2">자산 가치 증명 및 글로벌 규제 대응을 위한 혁신 전략</h2>
                            <div className="mt-12 flex gap-12 justify-center">
                                <div className="flex flex-col items-center opacity-80 hover:opacity-100 transition-opacity"><div className="bg-white/10 p-3 rounded-full mb-2"><ShieldCheck size={28} /></div><span className="text-sm font-medium">Security</span></div>
                                <div className="flex flex-col items-center opacity-80 hover:opacity-100 transition-opacity"><div className="bg-white/10 p-3 rounded-full mb-2"><Database size={28} /></div><span className="text-sm font-medium">Traceability</span></div>
                                <div className="flex flex-col items-center opacity-80 hover:opacity-100 transition-opacity"><div className="bg-white/10 p-3 rounded-full mb-2"><FileCheck size={28} /></div><span className="text-sm font-medium">Compliance</span></div>
                            </div>
                        </div>
                    )
                },
                {
                    id: 'definition',
                    render: () => (
                        <SlideLayout title="유한화학의 DI System은?">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center h-full">
                                <div className="space-y-6">
                                    <div className="bg-slate-50 p-5 rounded-xl border-l-4 shadow-sm" style={{borderColor: theme.primary}}>
                                        <h3 className="text-lg md:text-xl font-bold mb-2 flex items-center gap-2" style={{color: theme.secondary}}>
                                            <Database size={22} style={{color: theme.primary}}/> 자산 가치 증명
                                        </h3>
                                        <p className="text-sm md:text-base text-gray-700 leading-relaxed-custom">
                                            제품 생산 및 연구 과정의 신뢰성을 입증하여 유한화학의 <strong>핵심 유/무형 자산을 보호</strong>하고 그 가치를 데이터로 증명하는 시스템입니다.
                                        </p>
                                    </div>
                                    <div className="bg-slate-50 p-5 rounded-xl border-l-4 shadow-sm" style={{borderColor: theme.secondary}}>
                                        <h3 className="text-lg md:text-xl font-bold mb-2 flex items-center gap-2" style={{color: theme.secondary}}>
                                            <ShieldCheck size={22} style={{color: theme.secondary}}/> 보안 및 통제 활동
                                        </h3>
                                        <p className="text-sm md:text-base text-gray-700 leading-relaxed-custom">
                                            데이터의 <strong>누락, 조작, 오염을 원천 차단</strong>하기 위한 기술적 통제(Technical Controls)를 통해 완벽한 신뢰 프로세스를 구축합니다.
                                        </p>
                                    </div>
                                </div>
                                <div className="h-full max-h-[320px] bg-gradient-to-br from-gray-50 to-white rounded-2xl p-4 flex flex-col items-center justify-center relative overflow-hidden border border-gray-200 shadow-inner">
                                    <div className="text-center z-10">
                                        <div className="inline-flex items-center justify-center p-5 text-white rounded-full shadow-xl mb-4" style={{backgroundColor: theme.secondary}}><Lock size={40} /></div>
                                        <h4 className="text-lg font-bold mb-1" style={{color: theme.secondary}}>글로벌 규제 완벽 대응</h4>
                                        <p className="text-sm text-gray-600 font-medium">FDA 21 CFR Part 11 / EU Annex 11</p>
                                    </div>
                                    <div className="absolute inset-0 opacity-[0.03] bg-[radial-gradient(#001738_1px,transparent_1px)] [background-size:16px_16px]"></div>
                                </div>
                            </div>
                        </SlideLayout>
                    )
                },
                {
                    id: 'alcoa',
                    render: () => (
                        <SlideLayout title="ALCOA++ 기반 데이터 관리 전략">
                            <div className="flex flex-col h-full">
                                <div className="p-4 rounded-xl text-white mb-4 shadow-md flex-none flex items-center justify-between" style={{backgroundColor: theme.secondary}}>
                                    <div><h3 className="text-xl font-bold">ALCOA++ Standard</h3><p className="opacity-80 text-sm">데이터 무결성을 위한 10가지 골든 룰</p></div>
                                    <div className="flex gap-1.5">{['A','L','C','O','A','+','+'].map((t, i) => (<div key={i} className="w-8 h-8 flex items-center justify-center font-bold rounded shadow-sm text-sm" style={{backgroundColor: theme.primary}}>{t}</div>))}</div>
                                </div>
                                <div className="flex-1 grid grid-cols-2 md:grid-cols-5 gap-3">
                                    {[
                                        {k: 'Attributable', v: '누가, 언제 생성했는가?'}, {k: 'Legible', v: '영구적 식별/판독 가능'}, {k: 'Contemporaneous', v: '활동 시점 실시간 기록'}, {k: 'Original', v: '최초의 원본 유지'}, {k: 'Accurate', v: '오류 없는 정확성'},
                                        {k: 'Complete', v: '누락 없는 완전성'}, {k: 'Consistent', v: '논리적 순서/일관성'}, {k: 'Enduring', v: '안전한 보존 기간'}, {k: 'Available (+)', v: '즉시 검색/열람 가능'}, {k: 'Traceability (++)', v: '변경 이력 완벽 추적'}
                                    ].map((item, idx) => (
                                        <div key={idx} className={`border p-3 rounded-lg hover:shadow-md transition-all bg-white flex flex-col justify-center group ${idx >= 8 ? 'ring-2 bg-red-50' : ''}`} style={{borderColor: idx >= 8 ? `${theme.primary}33` : ''}}>
                                            <p className="font-bold mb-1 text-sm md:text-base group-hover:scale-105 transition-transform origin-left" style={{color: theme.primary}}>{item.k}</p>
                                            <p className="text-xs md:text-sm opacity-80 leading-snug" style={{color: theme.secondary}}>{item.v}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </SlideLayout>
                    )
                },
                {

                                        "절약된 에너지를 수치화하고, 지속적인 모니터링과 피드백을 통해<br/>
                                        <span className="text-[#0D4C8F]">비용 절감의 가시화</span>를 제공합니다."
                                    </p>
                                </div>
                            </div>
                        </SlideLayout>
                    )
                }
            ];

            const slides = project === 'yuhan' ? yuhanSlides : amkorSlides;

            const nextSlide = () => setActiveSlide((prev) => (prev + 1) % slides.length);
            const prevSlide = () => setActiveSlide((prev) => (prev - 1 + slides.length) % slides.length);

            return (
                <div className="w-full flex flex-col items-center justify-center">
                    
                    {/* 상단 프로젝트 토글 - 외부로 이동 */}
                    <div className="flex items-center gap-3 glass-panel p-2 rounded-full px-4 shadow-sm mb-6 z-50">
                         <span className={`text-xs font-bold transition-colors ${project === 'yuhan' ? 'text-[#AF251B]' : 'text-gray-400'}`}>Yuhan Chemical</span>
                         <div className="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="toggle" className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 left-0" 
                                style={{borderColor: project === 'yuhan' ? '#AF251B' : '#0D4C8F', left: project === 'yuhan' ? '0' : '50%'}}
                                checked={project === 'amkor'} 
                                onChange={toggleProject}
                            />
                            <label htmlFor="toggle" className="toggle-label block overflow-hidden h-6 rounded-full cursor-pointer transition-colors duration-300 opacity-50" 
                                style={{backgroundColor: project === 'yuhan' ? '#AF251B' : '#0D4C8F'}}
                            ></label>
                        </div>
                        <span className={`text-xs font-bold transition-colors ${project === 'amkor' ? 'text-[#0D4C8F]' : 'text-gray-400'}`}>Amkor Tech</span>
                    </div>

                    <div className="w-full max-w-6xl aspect-video bg-white shadow-2xl rounded-2xl md:rounded-3xl overflow-hidden flex flex-col relative border border-gray-200 transition-all duration-500">
                        {/* Header */}
                        <div className="h-14 border-b flex items-center justify-between px-6 bg-white z-20 flex-none relative">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 rounded-lg flex items-center justify-center text-white font-bold text-xs italic shadow-sm transition-colors duration-500" style={{backgroundColor: theme.primary}}>
                                    {theme.logo}
                                </div>
                                <span className="font-bold text-base tracking-tight transition-colors duration-500" style={{color: theme.secondary}}>
                                    {project === 'yuhan' ? 'YUHAN' : 'AMKOR'} <span style={{color: theme.primary}}>{project === 'yuhan' ? 'DI' : 'FEMS'}</span> PROJECT
                                </span>
                            </div>
                            <div className="flex items-center gap-3 text-sm font-medium">
                                <span className="px-3 py-1 bg-gray-100 rounded-full text-xs transition-colors duration-500" style={{color: theme.secondary}}>
                                    {project === 'yuhan' ? 'Phase 2: 고도화 전략' : 'Phase 1: 아키텍처 설계'}
                                </span>
                                <div className="w-px h-3 bg-gray-300"></div>
                                <span className="text-gray-500 italic text-xs">Provided by GANI Co., Ltd.</span>
                            </div>
                        </div>

                        {/* Content */}
                        <div className="flex-1 relative overflow-hidden bg-white">
                            {slides[activeSlide].render()}
                        </div>

                        {/* Footer Controls */}
                        <div className="h-16 bg-gray-50 border-t flex items-center justify-between px-6 z-20 flex-none">
                            <div className="flex gap-2">
                                {slides.map((_, i) => (
                                    <div 
                                        key={i} 
                                        className={`h-1.5 rounded-full transition-all duration-300 cursor-pointer hover:bg-gray-400`}
                                        style={{width: activeSlide === i ? '2rem' : '0.5rem', backgroundColor: activeSlide === i ? theme.primary : '#d1d5db'}}
                                        onClick={() => setActiveSlide(i)}
                                    />
                                ))}
                            </div>
                            <div className="flex gap-3">
                                <button 
                                    onClick={prevSlide}
                                    className="px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-100 transition-colors font-bold text-sm text-gray-700"
                                >
                                    PREV
                                </button>
                                <button 
                                    onClick={nextSlide}
                                    className="px-5 py-2 rounded-lg text-white transition-colors font-bold text-sm flex items-center gap-2 shadow-md hover:opacity-90"
                                    style={{backgroundColor: theme.secondary}}
                                >
                                    {activeSlide === slides.length - 1 ? 'RESTART' : 'NEXT'}
                                    <ChevronRight size={16} />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
