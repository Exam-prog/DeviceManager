                                        </p>
                                    </div>
                                    <div className="bg-slate-50 p-5 rounded-xl border-l-4 border-[#001738] shadow-sm">
                                        <h3 className="text-lg md:text-xl font-bold text-[#001738] mb-2 flex items-center gap-2">
                                            <ShieldCheck size={22} className="text-[#001738]"/> 보안 및 통제 활동

                                        <p className="text-sm md:text-base text-gray-700 leading-relaxed-custom">

                                        </p>
                                    </div>
                                </div>

                                        <p className="opacity-80 text-sm">데이터 무결성을 위한 10가지 골든 룰</p>

                                    <div className="flex gap-1.5">
                                        {['A','L','C','O','A','+','+'].map((t, i) => (

                                        ))}
                                    </div>
                                </div>
                                <div className="flex-1 grid grid-cols-2 md:grid-cols-5 gap-3">
                                    {[
                                        {k: 'Attributable', v: '누가, 언제 생성했는가?'},
                                        {k: 'Legible', v: '영구적 식별/판독 가능'},
                                        {k: 'Contemporaneous', v: '활동 시점 실시간 기록'},
                                        {k: 'Original', v: '최초의 원본 유지'},
                                        {k: 'Accurate', v: '오류 없는 정확성'},
                                        {k: 'Complete', v: '누락 없는 완전성'},

                                </div>

                                <div className="flex-1 bg-white border rounded-xl shadow-inner p-4 relative flex flex-col overflow-hidden">
                                    {/* Mock Chart Area */}
                                    <div className="h-1/2 bg-slate-50 relative flex items-end px-4 gap-2 border-b pb-2 mb-2 min-h-[120px]">
                                        {[40, 42, 45, 85, 50, 42, 40, 41, 43, 40].map((h, i) => (

                                                <FileCheck size={16}/> Linked Audit Trail List

                                            <span className="text-xs bg-[#001738] text-white px-2 py-0.5 rounded-full">Filtered: 14:02:30 ~ 14:02:35</span>

                                                    <tr className="text-gray-400">
